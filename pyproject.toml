[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-commerce-agent"
version = "0.1.0"
description = "Google ADK agent on Gemini that answers product, price, stock and promotion questions through an MCP catalog server, with guardrails, evaluations and a React UI."
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.15",
  "mcp>=2.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["commerce_agent*", "api*", "evals*"]

[tool.setuptools.package-data]
commerce_agent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
