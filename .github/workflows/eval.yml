name: eval
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["evals/trigger.txt"]
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no API key is set
        if: env.GOOGLE_API_KEY == ''
        run: echo "Add a GOOGLE_API_KEY repository secret to run the evaluation." 
      - uses: actions/setup-python@v5
        if: env.GOOGLE_API_KEY != ''
        with:
          python-version: "3.13"
      - name: Run evaluation against Gemini
        if: env.GOOGLE_API_KEY != ''
        run: |
          pip install -e .
          mkdir -p evals/results
          python -m evals.run_eval 2>&1 | tail -n 200 | tee evals/results/last_run.log
      - name: Commit results
        if: always() && env.GOOGLE_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r evals/results /tmp/results
          git fetch origin eval-runs && git checkout eval-runs || git checkout --orphan eval-runs
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p runs && cp /tmp/results/* runs/
          git add -f runs/
          git commit -m "Evaluation run $GITHUB_RUN_ID" && git push origin eval-runs
